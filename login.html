<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page title and external added stylesheets -->
    <title>Switch2EV</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header containing logo and search bar -->
    <header>
        <!-- Logo aligned to the left side -->
        <div style="Float:left;">
            <img src="assets/images/Logo.png" height="40px" width="160px" alt="Switch2EV Logo">
        </div>
        <!-- Search bar aligned to the right side -->
        <div style="Float:right;">
            <form class="searchform">
                <input class="searchbar" type="text" placeholder="Search">
                <button class="searchbutton">&#128269;</button>
            </form>
        </div>
    </header>

    <!-- Navigation bar linking all the pages together -->
    <nav>
        <a href="index.html">Home Page</a>
        <a href="about.html">About Us</a>
        <a href="ev-info.html">EV & PHEV Info</a>
        <a href="charging.html">Charging</a>
        <a href="contact.html">Contact Us</a>
        <a href="incentives.html">Incentives</a>
        <a href="login.html">Login / Signup</a>
    </nav>

    <!-- Starting of Content -->
    <div class="container-fluid px-5 mt-5 mb-5">
        <!-- Authentication container with toggle between login and signup -->
        <div class="auth-container">
            <!-- Toggle buttons for switching between login and signup forms -->
            <div class="auth-toggle">
                <button class="auth-toggle-btn active" id="loginToggle">Login</button>
                <button class="auth-toggle-btn" id="signupToggle">Sign Up</button>
            </div>

            <!-- Login form (visible by default) -->
            <form id="loginForm" class="auth-form">
                <!-- Email input field -->
                <div class="mb-3">
                    <input type="email" class="form-control" id="loginEmail" placeholder="Email Address" required>
                </div>
                <!-- Password input field -->
                <div class="mb-3">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                </div>
                <!-- Forgot password link -->
                <div class="forgot-password">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>
                <!-- Login submission button -->
                <button type="submit" class="btn btn-primary btn-auth">Login</button>
                <!-- Link to switch to signup form -->
                <div class="auth-switch-link mt-3 text-center">
                    New member? Click<a href="#" id="switchToSignup"> here </a>to signup
                </div>
            </form>

            <!-- Signup form (hidden by default) -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <!-- Name fields in a row -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="signupFirstName" placeholder="First Name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="signupLastName" placeholder="Last Name">
                    </div>
                </div>
                <!-- Email input field -->
                <div class="mb-3">
                    <input type="email" class="form-control" id="signupEmail" placeholder="Email Address" required>
                </div>
                <!-- Password input field -->
                <div class="mb-3">
                    <input type="password" class="form-control" id="signupPassword" placeholder="Password" required>
                </div>
                <!-- Password confirmation field -->
                <div class="mb-3">
                    <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Confirm Password" required>
                </div>
                <!-- Account creation button -->
                <button type="submit" class="btn btn-primary btn-auth">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Modal popup for displaying authentication messages -->
    <div class="modal fade" id="authPopup" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal header with title and close button -->
                <div class="modal-header">
                    <h5 class="modal-title" id="authPopupTitle">Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Modal body containing the message content -->
                <div class="modal-body">
                    <p id="authPopupMessage"></p>
                </div>
                <!-- Modal footer with close action -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer section with copyright -->
    <div style="background-color:#023e8a; color: White; clear:both;text-align:center;">
        Switch2EV Copyright © 2025 | All Rights Reserved
    </div>

    <!-- JavaScript for handling login/signup functionality -->
    <script src="assets/js/login.js"></script>
</body>
</html>
